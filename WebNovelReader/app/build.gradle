apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    namespace 'app.novelreader'
    compileSdk 34

    defaultConfig {
        applicationId "app.novelreader"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        debug {
            // 環境ごとに自動生成される既定のdebug鍵ではなく、リポジトリに含まれる固定の鍵を使う。
            // これによりTermuxでのビルドとGitHub Actionsでのビルドが常に同じ署名になり、
            // アップデート時にアンインストールしなくても上書きインストールできる
            // （署名が変わるたびにアンインストールが必要になり、年齢確認Cookie等の
            // アプリ内保存データが毎回消えてしまう問題を避けるため）。
            storeFile file("../debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    buildFeatures {
        viewBinding false
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'org.jsoup:jsoup:1.17.2'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.1'
    implementation 'androidx.work:work-runtime-ktx:2.9.1'
}
